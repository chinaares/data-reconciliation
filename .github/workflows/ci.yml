name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # embedded-redis ships native redis-server binaries for both, so the
        # Redis-backed tests run natively on each runner.
        # os: [ubuntu-latest, macos-latest]
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Keep this a bare major version. The pom pins <jdkToolchain>
          # <version>25</version>, and Maven matches that request against the
          # toolchain's declared <version> string exactly. A full 25.0.x
          # version here would not match and surefire would abort with
          # "Requested toolchain specification did not match any configured
          # toolchain: {version=25}".
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Configure Maven toolchain
        # setup-java also writes ~/.m2/toolchains.xml, but it derives the
        # <version> it declares from the java-version input. Writing it
        # explicitly keeps the toolchain pinned to <version>25</version>
        # regardless of which JDK setup-java resolved.
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>adoptium</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Verify the tests really ran on JDK 25
        # maven-compiler-plugin falls back silently to the JDK running Maven
        # when the toolchain does not match, so a green build alone does not
        # prove the toolchain was honoured. surefire reports the JVM it
        # forked, so assert on that.
        run: |
          java_version=$(grep -ho 'name="java.version" value="[^"]*"' target/surefire-reports/*.xml | head -1 | sed 's/.*value="//;s/"$//')
          echo "test JVM java.version=$java_version"
          case "$java_version" in
            25.*) ;;
            *) echo "::error::expected the test JVM on JDK 25, got '$java_version'"; exit 1 ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: data-reconciliation-${{ matrix.os }}
          path: target/*.jar
          if-no-files-found: error
